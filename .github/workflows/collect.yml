# 일일 수집 워크플로 (M0-14 골격 → M1-26 완성, FR-150 · FR-152 · FR-153) — 가드 → 수집 → 정제·분류 → 데이터 브리핑 → 검증 게이트
# → 빌드 → data 커밋 → 배포. CLAUDE.md §6.1 · §10, PRD §10 운영 흐름.
#
# collect job 단계(번호 = CLAUDE.md §6.1 흐름) — 앞 단계가 실패하면 뒤 단계는 돌지 않는다(검증·빌드가 실패하면 커밋·배포하지
# 않고 전날 사이트를 유지한다).
#   ①②③ 수집 · 정제·분류 · 브리핑 `npm run collect` (scripts/collect.ts → scripts/lib/collect-run.ts): data 원본 삭제(M1-25) →
#      일일 수집 대상 피드 → 같은 URL·같은 사건 묶기 → 점수화 상위 MAX_ITEMS_PER_RUN(아래 env 45 — FR-06) 원제목 카드 →
#      data/news/<발행일>.json, 전날 경기 데이터(football-data·API-Football) → 브리핑 단건(LLM 출력은 로그만 — 검증·게시 M1-45 전)
#      + 같은 입력의 코드 템플릿 → data/briefs/<발행일>.json(D38 — 경기가 없으면 empty), 실행 기록 → data/runs.json(prod —
#      GITHUB_ACTIONS=true). 단계 출력(형식 scripts/lib/collect-outputs.ts): publish_date(KST 발행일 = 수집 시작 시각의 KST 날짜)
#      · run_id · status · run_recorded — 실패한 실행(exit 1)도 쓴다.
#   (보조) 소스 이슈 보고 — 수집이 쓴 소스 건강도 사건 파일로 source-broken 이슈(M1-11). 실패해도 뒤 단계를 막지 않는다.
#   ④ 검증 게이트 `npm run validate -- --publish-date <publish_date>` (FR-153, M1-25): configs·data 스키마·교차 참조 + 발행 게이트
#      (뉴스 카드 ai·요약 줄·링크 형식, 미래 날짜 파일, 그 발행일 파일의 카드 수 하한 10장 — 휴식기 5장, 파일이 없으면 실패 —,
#      남은 삭제 요청 카드·보존 기간 만료 출처, 삭제 요청 72시간은 경고). 발행일은 수집 단계가 출력한 값만 쓴다 — 검증 시각의
#      `today`는 자정을 넘긴 실행에서 수집이 쓴 파일과 어긋난다.
#   ⑤ 정적 빌드 `npm run build` — 빌드가 깨지는 데이터는 커밋하지 않는다(배포용 빌드는 deploy.yml이 커밋 SHA로 다시 한다).
#   ⑥ data 커밋 · push — data/·public/ 변경분만 `chore(data): <publish_date> 발행`, `git pull --rebase` 뒤 push(rebase 충돌은
#      push하지 않고 실패). 변경이 없으면 커밋·배포를 건너뛴다. rebase로 얹은 main의 새 커밋은 검증 게이트를 다시 거치지 않는다
#      (deploy.yml은 빌드·번들·비밀값만 다시 본다 — 커밋 단계 주석).
#   (보조) 실패 단계 기록 — 실패했을 때만. 멈춘 단계를 job output `reason`으로 넘겨 실패 이슈의 job 결과 행에 붙인다.
#   ⑦ 배포 — deploy job이 커밋 SHA로 deploy.yml(재사용 — concurrency pages)을 부른다.
#
# 봇 커밋 시각: ⑥은 06:00~08:00 KST(CLAUDE.md §10의 push 금지 시간대)에 도는 것이 정상이다. 그 금지는 **사람 push** 규칙이다 —
# 사람 push가 이 실행의 rebase·push·배포(concurrency pages)와 겹치지 않게 하려는 것이라 봇의 data 커밋에는 적용되지 않는다.
#
# 트리거 — 계절별 발행 시각(PRD §15 D26, FR-150): 여름(유럽 서머타임 기간) 06:30 수집 → 07:00 공개,
# 겨울(유럽 표준시 기간) 07:10 수집 → 07:30 공개. 계절은 src/lib/time.ts publishSlot(europeanSummerTimeTransitions)이 발행일
# (KST) 기준으로 판정한다 — 전환 순간이 일요일 10:00 KST라 전환일 아침은 전환 전 계절(2026-10-26(월)부터 07:10 수집,
# 2027-03-29(월)부터 06:30 수집). 트리거는 계절마다 2개씩 4개이고, guard가 계절에 맞지 않는 쪽을 skip한다(M1-47).
# - 주 경로: cron-job.org 작업 2개 → workflow_dispatch (fine-grained PAT, Actions 권한만 — 저장소에 두지 않는다).
#   06:30 KST 작업은 본문 {"ref":"main","inputs":{"slot":"summer"}}, 07:10 KST 작업은 {"ref":"main","inputs":{"slot":"winter"}}.
#   cron-job.org 정기 실행 활성화·본문 갱신은 M1-40 리허설 후(M0-15는 호출 테스트만 — 지금 본문 {"ref":"main"}은 slot이 없어
#   수동 실행처럼 12시간 가드만 본다).
# - 백업: schedule 2개 — 06:40 KST(`40 21 * * *`, 여름) · 07:20 KST(`20 22 * * *`, 겨울). 같은 계절의 주 경로 실행이
#   진행 중이면 concurrency로 기다렸다가 12시간 가드로 건너뛴다. 저장소 변수 COLLECT_ENABLED == 'true'일 때만 진행한다
#   (M1-40 리허설 전에는 매일 빈 실행을 하지 않게). workflow_dispatch는 이 변수와 무관하게 진행한다.
# - 계절 가드: 여름에는 07:10 dispatch(slot=winter)·07:20 schedule, 겨울에는 06:30 dispatch(slot=summer)·06:40 schedule을
#   skip한다(실패 아님 — collect job이 skipped라 12시간 가드의 성공 이력에도 들어가지 않는다). slot 입력 없는 수동 실행은
#   계절 판정 없이 12시간 가드만, force는 12시간 가드도 건너뛴다(이전과 같다). 판단 순서는 scripts/lib/collect-guard.ts.
#
# job 흐름: guard(판단) → collect(수집·검증·빌드·커밋) → deploy(deploy.yml 재사용) / 어느 하나라도 실패 → report-failure
# - guard가 건너뛰기로 판단하면 collect·deploy는 skipped, 실행은 성공으로 끝난다(skip은 실패가 아니다).
# - 12시간 가드는 "collect job이 success로 끝난 실행"만 성공 이력으로 센다. skip된 실행(collect skipped)을
#   성공 이력으로 세면 skip이 skip을 부르는 연쇄가 생기기 때문이다 — 자세한 근거는 scripts/lib/collect-guard.ts.
#   그래서 collect job의 name을 바꾸면 scripts/lib/collect-guard.ts의 COLLECT_JOB_NAME도 바꿔야 한다(테스트가 확인).
# - 검증·빌드가 실패하면 커밋하지 않는다: 커밋 단계는 if 조건 없이(= 앞 단계가 모두 성공했을 때만) validate·build 뒤에 있다.
#   이때 collect job이 실패라 deploy는 skipped, report-failure가 실패 이슈를 만든다(원인 키 collect:collect — 멈춘 단계는 메모).
# - 단계 구조는 tests/collect-workflow.test.ts가 고정한다(순서·조건·발행일 전달·커밋 경로·배포 연결).
# - 소스 이슈(M1-11, FR-11·FR-152, PRD §10·§15 D35): 수집 단계가 소스 건강도 사건(source-broken payload 배열)을
#   $RUNNER_TEMP 파일에 쓰고, 바로 다음 단계가 그 파일로 소스별 이슈 하나(fingerprint source:<id>)를 만들거나 댓글을 단다.
#   쓰기 토큰은 그 단계 env로만 넘긴다(env 수준 격리 — 한계는 그 단계 주석). 실행 자체의 실패 보고(report-failure)와는 별개다.
name: Collect
run-name: "Collect (${{ github.event_name }}${{ github.event.schedule && format(' {0}', github.event.schedule) || '' }}${{ inputs.slot && format(', slot {0}', inputs.slot) || '' }}${{ inputs.force && ', force' || '' }}${{ inputs.limit && format(', limit {0}', inputs.limit) || '' }})"

on:
  workflow_dispatch:
    inputs:
      # 검증 게이트의 카드 수 하한(평시 10장 · 휴식기 5장, FR-153)은 그날 파일 전체(이미 있던 카드 + 이번 카드)로 센다 — 그날 첫
      # 실행을 하한보다 작은 limit로 돌리면 게이트에서 멈춘다(커밋·배포 없음). 정기 실행·M1-40 리허설은 비워 둔다(기본 상한).
      limit:
        description: "소량 실행 — 점수화 선별 상한(양의 정수). 비우면 MAX_ITEMS_PER_RUN(45). 10 미만(휴식기 5 미만)이면 그날 첫 실행은 카드 수 하한에 못 미쳐 검증 게이트에서 멈춘다(커밋·배포 없음)"
        type: string
        required: false
        default: ""
      force:
        description: "12시간 내 성공 이력이 있어도 실행 (수동 재실행용)"
        type: boolean
        required: false
        default: false
      # cron-job.org 작업이 본문 inputs로 보낸다(06:30 작업 summer · 07:10 작업 winter). 수동 실행은 비워 둔다 — 값이 있으면
      # 그 계절이 아닌 날 skip한다. 값 검증(비움·summer·winter 외 → guard 실패)은 scripts/lib/collect-guard.ts readTriggerSlot.
      slot:
        description: "계절 슬롯 — cron-job.org 전용(summer = 06:30 작업 · winter = 07:10 작업). 수동 실행은 비워 둔다"
        type: string
        required: false
        default: ""
  schedule:
    # 백업 2개 — cron은 UTC라 UTC 날짜로는 하루 전이지만 KST로는 당일 아침이다. 한국은 서머타임이 없어 연중 고정이고,
    # 둘 중 그날 계절에 맞는 하나만 진행한다(guard — SCHEDULE_SEASONS와 글자까지 같게, tests/collect-guard.test.ts가 확인).
    # GitHub schedule은 부하에 따라 수 분~수십 분 늦게 시작될 수 있다(백업이라 허용 — 계절은 시계가 아니라 발행일로 판정).
    - cron: "40 21 * * *" # 06:40 KST — 여름(유럽 서머타임 기간)
    - cron: "20 22 * * *" # 07:20 KST — 겨울(유럽 표준시 기간)

# 수집 실행은 한 번에 하나만, 진행 중인 실행은 끊지 않는다(대기는 최신 1건만 남고 그 사이 대기분은 GitHub가 취소).
# 그룹 이름은 deploy.yml의 `pages`와 겹치면 안 된다(같으면 호출 측과 서로 기다린다).
concurrency:
  group: collect
  cancel-in-progress: false

# 기본 권한은 없음 — job마다 필요한 권한만 준다.
permissions: {}

jobs:
  guard:
    name: 실행 판단 (계절 · 12시간 가드)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      actions: read # 이 워크플로의 최근 실행·job 결과 조회
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js 설정 (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 판단 결과를 output(run·reason)과 Step Summary에 남긴다. 건너뛰기(계절 off-season 포함)도 exit 0(성공).
      # 이력 조회가 실패하거나 모르는 cron·slot 값이면 exit 1 → 수집하지 않고 report-failure가 이슈를 만든다. 모르는 cron·slot은
      # 이벤트·main·COLLECT_ENABLED 판정 뒤에 실패로 보므로, 꺼진 schedule·main이 아닌 실행은 건너뛰기(exit 0)로 끝난다.
      # SCHEDULE·SLOT은 셸에 펼치지 않고 env로만 넘긴다(입력값 주입 방지). schedule이 아니면 SCHEDULE은 빈 값이다.
      - name: 실행 여부 판단
        id: decide
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_ENABLED: ${{ vars.COLLECT_ENABLED }}
          FORCE: ${{ inputs.force }}
          SCHEDULE: ${{ github.event.schedule }}
          SLOT: ${{ inputs.slot }}
        run: node --import tsx scripts/collect-guard.ts

  collect:
    # 이 이름은 12시간 가드가 성공 이력을 찾는 기준이다 — 바꾸면 scripts/lib/collect-guard.ts의 COLLECT_JOB_NAME도 함께.
    name: 수집 · 검증 · 빌드 · 커밋 (collect)
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    # job 전체 상한(여유 포함). 일일 브리핑은 단건 Messages API 1~3요청(D28 — 배치 대기 없음)이다. 브리핑 마감
    # (공개 목표 −10분 — 여름 06:50 · 겨울 07:20, FR-26)은 collect 스크립트가 발행일 슬롯(src/lib/time.ts publishSlot)으로
    # 계산해 경기 데이터 단계 예산·LLM 재시도를 그 안으로 묶는다(scripts/lib/collect-deadlines.ts, M1-47). 마감까지 성공하지
    # 못하면 코드 템플릿 게시는 M1-45. 마감이 이미 지났거나 3분도 남지 않은 실행(수동·지연 실행)은 시작 + 8분을 마감으로 쓴다.
    # step 상한과의 관계: run 단계에는 모두 step 상한을 둔다(설치 4 · 수집 22 · 소스 이슈 3 · 검증 5 · 빌드 10 · 커밋 5 · 실패
    # 기록 1분). step 시간 초과는 그 단계의 실패라 뒤의 실패 단계 기록·report-failure가 돈다. job 시간 초과는 job을 취소해
    # 실패 단계 기록이 돌지 않으므로, "한 단계가 상한까지 걸리고 나머지는 평소 시간"인 경우가 job 상한 안에 들어가게 둔다:
    # 가장 긴 수집 22분 + 그 밖의 단계 실측 1분 안팎(준비·설치 약 25초, 검증·빌드·커밋 약 20초) + 실패 기록 1분 ≈ 24분 < 30분.
    # step 상한을 모두 더한 값(50분)은 job 상한보다 크다 — 둘 이상이 동시에 상한 가까이 걸리면 job 시간 초과로 끝날 수 있다.
    # (tests/collect-workflow.test.ts가 "가장 큰 step 상한 + 5분 ≤ job 상한"을 확인한다.)
    timeout-minutes: 30
    permissions:
      contents: write # data/·public/ 커밋 push
      issues: write # 소스 이슈 보고 단계만 env로 토큰을 받는다(M1-11 — env 수준 격리, 한계는 그 단계 주석)
    # committed·sha → deploy job. publish_date·run_id·status → 실행 기록·실패 이슈가 같은 실행을 가리키는 키(실패 실행 기록 보존
    # M1-27이 이어받는다). reason → 실패했을 때 멈춘 단계(report-failure의 이슈 헬퍼가 needs.collect.outputs.reason을 메모로 쓴다).
    # 실패한 job의 출력도 그때까지 돈 단계 값으로 넘어간다고 보고 쓴다(첫 실패 실행에서 확인할 것 — 안 넘어오면 이슈 메모만 빠진다).
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
      publish_date: ${{ steps.collect.outputs.publish_date }}
      run_id: ${{ steps.collect.outputs.run_id }}
      status: ${{ steps.collect.outputs.status }}
      reason: ${{ steps.stopped.outputs.reason }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      LLM_MODE: live
      LLM_MODEL: claude-haiku-5-5
      MAX_ITEMS_PER_RUN: "45"
      DAILY_BUDGET_USD: "0.10"
      MONTHLY_BUDGET_USD: "3"
      SITE_URL: https://sguys99.github.io
      BASE_PATH: /euro-digest
      CONTACT_EMAIL: sguys99@gmail.com
    steps:
      # 실행이 concurrency로 기다리는 동안 main이 앞서 갔을 수 있어 트리거 시점 SHA 대신 main 최신을 받는다.
      # 쓰기 토큰(contents: write)을 .git/config에 남기지 않는다 — 설치·수집·빌드 단계에서 도는 서드파티 코드가
      # 읽지 못하게 하고, push 단계에서만 헤더로 넘긴다.
      - name: 저장소 체크아웃 (main)
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Node.js 설정 (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        id: install
        timeout-minutes: 4
        run: npm ci

      # ①수집 → 정제·분류(코드) → 데이터 브리핑(LLM). 비밀값은 이 단계에만 넘긴다(설치·검증·빌드 단계에는 노출하지 않는다).
      # 단계 출력 publish_date·run_id·status·run_recorded는 scripts/collect.ts가 $GITHUB_OUTPUT에 쓴다(실패 실행도 — 출력을 쓰지
      # 못하면 exit 1). 뒤 단계는 publish_date를 env로만 받는다.
      # limit 입력은 셸에 직접 펼치지 않고 env로 넘긴다(스크립트 주입 방지). 값 검증은 collect 스크립트가 한다.
      # GitHub 토큰은 env로 넘기지 않는다 — 소스 건강도 사건은 SOURCE_HEALTH_FILE(JSON)로만 내보내고 이슈는 다음 단계가 만든다.
      # COLLECT_ENABLED(저장소 변수 — 정기 운영 켜짐): 경기 기록 원장 data/matches/(M1-48b, PRD §15 D33)는 이 값이 'true'일 때만
      # 쓴다 — 정기 운영 전 수동 실행(workflow_dispatch)이 원장을 시작하면 정기 실행 전까지 빈 날이 생겨 "집계 시작일 이후" 누적이
      # 부정확해진다. 켠 뒤에는 수동 실행(workflow_dispatch)도 원장을 쓴다 — COLLECT_ENABLED를 켠 뒤 처음 원장을 쓰는 실행(수동
      # 포함)이 집계 시작일(meta.json since)을 정한다.
      - name: 수집 · 정제·분류 · 브리핑 (npm run collect)
        id: collect
        timeout-minutes: 22
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          COLLECT_ENABLED: ${{ vars.COLLECT_ENABLED }}
          LIMIT: ${{ inputs.limit }}
          SOURCE_HEALTH_FILE: ${{ runner.temp }}/source-health.json
        run: |
          args=()
          if [ -n "$LIMIT" ]; then
            args+=(--limit "$LIMIT")
          fi
          npm run collect -- "${args[@]}"

      # 소스 이슈 (M1-11 — FR-11·FR-152, PRD §10 "수집 일부 실패 → 이슈", §15 D35): 수집 단계가 쓴 사건 파일로 소스별 이슈
      # 하나(라벨 source-broken, fingerprint source:<id>)를 새로 만들거나 열린 이슈에 댓글을 단다. 사건 = 이번 실행의 소스
      # 실패(budget 제외) · 실패·빈 피드 3회 연속 · 새 기사 없음 7회 연속(판정 scripts/lib/source-health.ts).
      # - 조건: 수집 단계가 실행됐으면 성공·실패와 상관없이 돈다(exit 1이어도 연속 사건은 남긴다 — 모든 소스가 실패한
      #   실행은 원인이 하나라 소스별 실패 사건을 내지 않고 report-failure의 pipeline-failure 이슈 하나가 맡는다, FR-152).
      #   수동 취소(cancelled)이거나 수집 단계가 돌지 않았으면(앞 단계 실패로 skipped) 돌지 않는다.
      # - 사건 파일이 없거나 빈 배열(`[]`)이면 셸에서 끝낸다 — 토큰을 가진 node 프로세스를 띄우지 않는다(평소 대부분의 날).
      # - 위치: 수집 바로 뒤 — 토큰을 받는 단계 앞에서 도는 서드파티 코드를 줄이고(검증·빌드 전), 검증·빌드·커밋의
      #   성공 여부와 무관하게 보고한다. deploy job은 어차피 이 job 전체가 끝나기를 기다린다.
      # - 토큰 격리는 env 수준뿐이다: 토큰(issues: write — job 권한이라 contents: write도 같은 토큰)은 이 단계 env로만
      #   넘기지만, 같은 job의 앞 단계(npm ci·수집)에서 돈 코드가 작업 디렉터리 파일(scripts/·node_modules)을 바꾸면
      #   이 단계가 그 코드를 토큰과 함께 실행하므로 막지 못한다. 커밋 단계의 contents: write와 같은 수준의 위험이다
      #   (완전히 나누려면 별도 job + 새 체크아웃 + 아티팩트로 사건 파일 전달 — report-failure job과 같은 구조).
      # - continue-on-error: 이슈 보고 실패가 검증·빌드·커밋·배포를 막거나 job 결과를 뒤집지 않게 한다. 실패는 error 주석과
      #   로그로만 남는다(job은 성공이라 report-failure는 돌지 않는다) — 연속 사건은 다음 실행이 다시 낸다.
      - name: 소스 이슈 보고 (실패 · 건강도)
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_HEALTH_FILE: ${{ runner.temp }}/source-health.json
        run: |
          if [ ! -s "$SOURCE_HEALTH_FILE" ]; then
            echo "소스 건강도 사건 파일 없음 — 수집 단계가 판정 전에 끝났거나 수집한 소스가 없습니다. 보고를 건너뜁니다."
            exit 0
          fi
          if [ "$(tr -d '[:space:]' < "$SOURCE_HEALTH_FILE")" = "[]" ]; then
            echo "보고할 소스 사건 없음(빈 배열) — 건너뜁니다."
            exit 0
          fi
          node --import tsx scripts/report-issue.ts --kind source-broken --payload-file "$SOURCE_HEALTH_FILE"

      # ④ 발행 전 검증 게이트(FR-153 — configs·data 스키마·교차 참조 M0-17 + 발행 게이트 M1-25, 항목은 파일 머리 주석).
      #    실패하면 아래 빌드·커밋으로 가지 않는다 → 전날 사이트 유지 + 실패 이슈.
      #    발행일은 수집 단계 출력 publish_date만 쓴다(`today` 금지 — 자정 넘김 실행에서 어긋난다). 그 날짜 파일이 없거나 카드가
      #    하한보다 적으면 실패다. 출력이 비었으면(수집 진입점의 출력 쓰기가 빠진 회귀) 검증할 파일을 정할 수 없어 멈춘다.
      #    값은 `${{ }}`로 스크립트 본문에 넣지 않고 env로만 받아 형식을 확인한 뒤 넘긴다(주입 방지 — validate 인자 파서도 다시 본다).
      - name: 검증 게이트 (npm run validate)
        id: validate
        timeout-minutes: 5
        env:
          PUBLISH_DATE: ${{ steps.collect.outputs.publish_date }}
        run: |
          if [[ ! "$PUBLISH_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error title=발행일 없음::수집 단계 출력 publish_date가 비었거나 YYYY-MM-DD가 아닙니다 — 검증할 발행 파일을 정할 수 없어 커밋·배포를 멈춥니다(scripts/collect.ts 단계 출력 확인)"
            exit 1
          fi
          npm run validate -- --publish-date "$PUBLISH_DATE"

      # ⑤ 빌드가 깨지는 데이터는 커밋하지 않는다. 배포용 빌드는 deploy.yml이 커밋한 SHA로 다시 한다.
      - name: 정적 빌드 (npm run build)
        id: build
        timeout-minutes: 10
        run: npm run build

      # ⑥ data/·public/ 변경분만 github-actions[bot]으로 커밋 → main 최신으로 rebase → push. 커밋 메시지의 날짜는 수집 단계가
      #    출력한 발행일(검증 게이트가 본 날짜와 같다 — 이 단계는 검증이 통과했을 때만 돈다).
      #    시각: 06:00~08:00 KST(사람 push 금지 시간대, CLAUDE.md §10)에 도는 것이 정상이다 — 파일 머리 주석 "봇 커밋 시각".
      - name: data 커밋 · push
        id: commit
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_DATE: ${{ steps.collect.outputs.publish_date }}
        run: |
          # 커밋 대상 경로 중 있는 것만 쓴다(public/은 아직 없을 수 있고, 없는 pathspec은 git add가 거부한다).
          paths=()
          for dir in data public; do
            if [ -e "$dir" ]; then
              paths+=("$dir")
            fi
          done

          changes=""
          if [ "${#paths[@]}" -gt 0 ]; then
            changes="$(git status --porcelain --untracked-files=all -- "${paths[@]}")"
          fi

          # 산출물 경로 밖의 변경은 커밋하지 않는다. 파이프라인이 엉뚱한 곳에 쓰고 있다는 신호라 경고로 남긴다.
          outside="$(git status --porcelain --untracked-files=all -- . ':(exclude)data' ':(exclude)public')"
          if [ -n "$outside" ]; then
            echo "::warning title=산출물 경로 밖 변경::data/·public/ 밖의 변경은 커밋하지 않습니다 (로그 참고)"
            echo "$outside"
          fi

          if [ -z "$changes" ]; then
            echo "data/·public/ 변경 없음 — 커밋·배포를 건너뜁니다."
            {
              echo "committed=false"
              echo "sha="
            } >> "$GITHUB_OUTPUT"
            {
              echo "## data 커밋"
              echo ""
              echo "변경 없음 — 커밋·배포를 건너뛰었습니다."
            } >> "$GITHUB_STEP_SUMMARY" || echo "::warning title=요약 쓰기 실패::data 커밋 요약을 Step Summary에 쓰지 못했습니다"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "${paths[@]}"
          # 발행일 = 수집 단계 출력(KST — 아침 실행은 UTC로는 전날이다). 검증 단계가 형식을 확인했다.
          message="chore(data): ${PUBLISH_DATE} 발행"
          git commit --quiet -m "$message"

          # 인증은 actions/checkout과 같은 방식(http extraheader)으로 이 단계의 git 명령에만 붙인다(디스크에 남기지 않음).
          basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${basic_auth}"
          git_auth=(-c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${basic_auth}")

          # 실행 중 main이 앞서 갔을 수 있다(사람 push·다른 워크플로) → rebase 후 push, 네트워크 오류·push 경합에 대비해 3번까지.
          # - rebase 충돌은 다시 해도 같으므로 재시도하지 않는다: rebase를 되돌리고(push 없음 → 배포 없음, 전날 사이트 유지) 충돌
          #   파일을 로그에 남긴 뒤 실패 → report-failure가 이슈를 만든다. 산출물(data/·public/)은 봇만 쓰므로 보통은 생기지 않는다
          #   (사람이 같은 날 data/ 파일을 커밋했을 때 — runs-dev.json은 봇이 쓰지 않아 겹치지 않는다).
          # - --autostash는 산출물 밖 변경(위 경고) 대비.
          # - rebase로 main의 새 커밋을 얹은 트리는 **검증 게이트(validate)를 다시 돌리지 않는다**(빌드도 이 job에서는 다시 하지
          #   않는다). deploy.yml은 push한 SHA로 빌드·번들·비밀값 검사만 하고 validate는 하지 않는다 — 빌드가 깨지면 배포 단계에서
          #   멈추지만(data 커밋은 남고 사이트는 전날 그대로), main에서 들어온 configs 변경과 이번 data가 함께 게이트를 어기는 경우는
          #   막지 못한다(사람 push 금지 시간대라 드묾 — 다음 push의 ci.yml validate가 잡는다).
          for attempt in 1 2 3; do
            if ! git "${git_auth[@]}" pull --rebase --autostash origin main; then
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                conflicts="$(git diff --name-only --diff-filter=U | head -n 20)"
                git rebase --abort || true
                echo "::error title=rebase 충돌::main의 새 커밋과 data 커밋이 충돌해 push하지 않았습니다 — 커밋·배포 없음(전날 사이트 유지). 충돌 파일은 로그 참고"
                echo "충돌 파일:"
                echo "$conflicts"
                exit 1
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error title=pull 실패::3번 시도했지만 main을 받지 못했습니다"
                exit 1
              fi
              sleep $((attempt * 5))
              continue
            fi
            if git "${git_auth[@]}" push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=push 실패::3번 시도했지만 main에 push하지 못했습니다"
              exit 1
            fi
            sleep $((attempt * 5))
          done

          # push 직후 deploy job이 읽는 출력(committed·sha)부터 쓴다. 그 뒤 요약 쓰기는 실패해도 경고만 남기고 이 단계를 실패시키지
          # 않는다 — 단계가 실패하면 collect job이 실패해 deploy가 skipped되고, push한 data가 배포되지 않은 채 남기 때문이다.
          # (출력 파일 쓰기 자체가 실패하면 그때는 단계 실패 → deploy skipped — main에는 data 커밋이 있고 사이트는 전날 그대로.)
          sha="$(git rev-parse HEAD)"
          {
            echo "committed=true"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## data 커밋"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 커밋 | [\`${sha:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha) |"
            echo "| 메시지 | ${message} |"
            echo "| 변경 | $(git show --shortstat --format= HEAD | sed 's/^ *//') |"
          } >> "$GITHUB_STEP_SUMMARY" || echo "::warning title=요약 쓰기 실패::data 커밋 요약을 Step Summary에 쓰지 못했습니다 — push·배포는 계속합니다"

      # 실패 단계 기록 — 위 단계 중 하나가 실패했을 때만(취소·시간 초과로 job이 끊기면 돌지 않는다). 멈춘 단계를 job output
      # reason으로 넘기면 report-failure의 이슈 헬퍼가 job 결과 행의 메모로 붙인다(scripts/lib/report-issue-cli.ts parseNeedsJson
      # — needs.<job>.outputs.reason). 원인 키(collect:collect)는 그대로라 같은 job의 실패는 한 이슈에 댓글로 쌓인다.
      # 값은 아래 고정 문구 + 형식을 확인한 발행일만(입력값을 옮기지 않는다). 토큰을 받지 않는다. 소스 이슈 보고 단계의 실패
      # (continue-on-error)는 failure()에 잡히지 않는다.
      - name: 실패 단계 기록
        id: stopped
        if: failure()
        timeout-minutes: 1
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          PUBLISH_DATE: ${{ steps.collect.outputs.publish_date }}
        run: |
          if [ "$INSTALL_OUTCOME" = "failure" ]; then
            reason="의존성 설치(npm ci) 실패 — 수집 안 함"
          elif [ "$COLLECT_OUTCOME" = "failure" ]; then
            reason="수집 단계(npm run collect) 실패 — 검증·빌드·커밋·배포 안 함"
          elif [ "$VALIDATE_OUTCOME" = "failure" ]; then
            reason="검증 게이트(npm run validate) 실패 — 커밋·배포 안 함, 전날 사이트 유지"
          elif [ "$BUILD_OUTCOME" = "failure" ]; then
            reason="정적 빌드(npm run build) 실패 — 커밋·배포 안 함, 전날 사이트 유지"
          elif [ "$COMMIT_OUTCOME" = "failure" ]; then
            reason="data 커밋·push 단계 실패 — 배포 안 함, 사이트는 전날 그대로(main에 push까지 됐는지는 로그 확인)"
          else
            reason="준비 단계(체크아웃·Node.js 설정) 실패 — 수집 안 함"
          fi
          if [[ "$PUBLISH_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            reason="${reason} (발행일 ${PUBLISH_DATE})"
          fi
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          {
            echo "## 실패 단계"
            echo ""
            echo "${reason}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ⑦ 배포. GITHUB_TOKEN으로 push한 커밋은 ci.yml을 다시 트리거하지 않으므로(GitHub 규칙) 여기서 직접 배포한다.
  # 호출된 워크플로는 여기서 준 권한 이하로만 쓴다: build job contents·pages read, deploy job pages write·id-token write.
  deploy:
    name: 배포 (GitHub Pages)
    needs: collect
    if: needs.collect.outputs.committed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.collect.outputs.sha }}

  # FR-152 실행 실패 자동 이슈. job 수준 failure()는 needs로 이어진 job 중 하나라도 실패하면 참이다
  # (always()를 섞으면 수동 취소에도 이슈가 생기므로 쓰지 않는다). 시간 초과도 이슈가 되도록 오래 걸리는
  # 단계에는 step 수준 timeout-minutes를 둔다(step 시간 초과는 실패로 기록된다).
  #
  # 같은 원인 판단 (M0-22): scripts/report-issue.ts → scripts/lib/github-issues.ts
  # - 원인 키 = `collect:<실패 job>`(needs 결과에서 계산) → fingerprint 마커를 이슈 본문에 숨겨 두고,
  #   같은 마커의 열린 pipeline-failure 이슈가 있으면 댓글(누적 횟수 포함), 없으면 새 이슈. 닫힌 이슈는 해결로 본다.
  # - guard 실패와 deploy 실패처럼 원인이 다른 실패는 서로 다른 이슈가 된다.
  # - 헬퍼가 쓸 수 없을 때(npm ci 실패·레지스트리 장애 등)는 마지막 단계의 셸 폴백이 예전 방식
  #   ("열린 [collect] pipeline-failure 이슈가 있으면 댓글, 없으면 생성")으로 보고한다 — 보고 자체가 빠지지 않게.
  # 비밀값·전체 로그는 본문에 넣지 않는다(실행 링크만). needs 출력 중 job별 reason만 이슈에 옮긴다 — guard의 판단 사유와
  # collect의 멈춘 단계(실패 단계 기록 — 그 job 결과 행의 메모). 커밋 SHA·발행일 등 다른 출력은 옮기지 않는다.
  report-failure:
    name: 실패 이슈 보고
    needs: [guard, collect, deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read # checkout
      issues: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js 설정 (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        timeout-minutes: 4
        run: npm ci

      # 결과(새 이슈/댓글)는 로그·notice 주석·Step Summary에 남는다. 토큰은 env로만 넘기고 출력하지 않는다.
      - name: 이슈 생성 또는 댓글 (이슈 헬퍼)
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node --import tsx scripts/report-issue.ts --kind pipeline-failure --workflow collect

      # 위 단계 중 하나라도 실패했을 때만(헬퍼가 이미 보고했으면 건너뜀). 마커 없이 예전 규칙으로 보고한다.
      - name: 셸 폴백 — 이슈 헬퍼를 쓸 수 없을 때
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          GUARD_RESULT: ${{ needs.guard.result }}
          COLLECT_RESULT: ${{ needs.collect.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          now_kst="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          date_kst="$(TZ=Asia/Seoul date +%F)"
          body_file="$RUNNER_TEMP/pipeline-failure.md"
          {
            echo "collect.yml 일일 수집 실행이 실패했습니다. (이슈 헬퍼를 쓸 수 없어 셸 폴백으로 보고 — 보고 job 로그 확인)"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 실행 | ${RUN_URL} (시도 ${RUN_ATTEMPT}) |"
            echo "| 트리거 | ${EVENT_NAME} |"
            echo "| 시각 (KST) | ${now_kst} |"
            echo "| job 결과 | guard ${GUARD_RESULT:-?} · collect ${COLLECT_RESULT:-?} · deploy ${DEPLOY_RESULT:-?} |"
          } > "$body_file"

          existing="$(gh issue list --state open --label pipeline-failure --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("[collect]"))] | sort_by(.number) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body_file"
            echo "열린 이슈 #${existing}에 댓글을 남겼습니다 (셸 폴백)."
          else
            gh issue create \
              --title "[collect] 일일 수집 실패 — ${date_kst}" \
              --label pipeline-failure \
              --body-file "$body_file"
          fi
