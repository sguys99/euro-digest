# 주간 작업 워크플로 (M3-06 골격 — PRD FR-90, §10 운영 흐름 '월요일 weekly.yml', CLAUDE.md §6.1 · §10, D49 정신)
# — 주간 단계(실패 격리) → 검증 게이트 → 빌드 → data 커밋 → 배포. 구조는 collect.yml을 따른다(체크아웃 main 최신 · .nvmrc · npm ci ·
# 비밀값은 실행 단계 env로만 · rebase 재시도 push · 실패 실행 기록 보존 · deploy.yml 재사용 · 실패 이슈).
#
# weekly job 단계 — 앞 단계가 실패하면 뒤 단계는 돌지 않는다(검증·빌드가 실패하면 커밋·배포하지 않고 전 주 사이트를 유지한다).
#   ① 주간 작업 `npm run weekly` (scripts/weekly.ts → scripts/lib/weekly-run.ts): 대상 주차(지난 월~일) → 같은 주 재실행 가드(그 주차
#      한국 선수 주간 리포트 data/players/weekly/<주차>.json이 이미 있으면 force 없이는 건너뜀 — 실행 기록도 안 남김) → 등록 단계
#      (scripts/lib/weekly-stages.ts — ① 한국 선수 주간 리포트 M3-07 ② 분석 블로그 M3-08 ③ 팀 프로필 M4-06 ④ 운영 리포트 M5-09)를
#      순서대로 하나씩, 단계마다 try/catch + 시간 상한 — 한 단계의 실패가 다른 단계를 막지 않는다. 미구현 단계는 "미구현 — 건너뜀"
#      로그만(성공 처리). 실행 기록 → data/runs.json(job "weekly"). 종료 코드: 0 = 건너뜀·success·partial · 1 = failed(성공한 단계 없이
#      실패만)·준비 실패·실행 기록 실패. 단계 출력(형식 weekly-run.ts WEEKLY_OUTPUT_KEYS): skipped · week · publish_date · run_id ·
#      status · run_recorded · failed_stages · discard — 실패한 실행(exit 1)도 쓴다.
#   (보조) 실패 단계 산출물 되돌리기 — partial일 때 실패한 단계의 writes 경로(단계 출력 discard)를 main 상태로 되돌린다. 발행 산출물은
#      그 단계가 성공했을 때만 커밋한다(D49 정신 — 반쯤 쓴 파일이 검증·빌드·커밋에 들어가지 않게).
#   ② 검증 게이트 `npm run validate` — configs·data 스키마·교차 참조(주간 리포트 파일 포함). 발행일 카드 하한(--publish-date)은
#      일일 수집 몫이라 넘기지 않는다.
#   ③ 정적 빌드 `npm run build` — 빌드가 깨지는 데이터는 커밋하지 않는다(배포용 빌드는 deploy.yml이 커밋 SHA로 다시 한다).
#      앞에 OG 이미지 확인 → (구울 것이 있으면) 브라우저 캐시 · Chromium 설치(M5-01 — collect.yml과 같다).
#   ④ data 커밋 · push — data/·public/ 변경분만 `chore(data): <발행일> 주간 발행 (<주차>)`, rebase 뒤 push(충돌은 push하지 않고
#      실패). 변경이 없으면 커밋·배포를 건너뛴다. 가드가 건너뛴 실행은 ②~④를 돌지 않는다.
#   (보조) 실패 실행 기록 보존 — 위 단계가 실패했고 주간 작업이 실행 기록을 남겼을 때만(D49). main 최신 별도 작업 트리에 이번 실행
#      기록(상태 failed)만 커밋 → push(`chore(data): <발행일> 주간 실행 기록 (발행 실패)`). 주간 작업은 경기 원장·이월을 쓰지 않으므로
#      `--with-ledger`를 주지 않고 data/runs.json만 커밋한다. 배포하지 않는다. 규칙은 scripts/lib/run-preserve.ts.
#   (보조) 실패 단계 기록 — 실패했을 때만. 멈춘 단계를 job output reason·step으로 넘긴다(원인 키 `weekly:weekly/<step>`).
#   (보조) 단계 실패 표시 — partial(일부 단계 실패)이면 커밋·push 뒤 마지막에 job을 실패로 바꾼다 → report-failure가 실패 이슈
#      (원인 키 `weekly:weekly/stages`, 메모에 실패 단계 id). 성공한 단계의 산출물은 이미 커밋됐고 배포도 진행한다(deploy job 조건).
#   ⑤ 배포 — deploy job이 커밋 SHA로 deploy.yml(재사용 — concurrency pages)을 부른다.
#
# 트리거
# - schedule `0 23 * * 0` = 매주 월요일 08:00 KST(UTC 일요일 23:00 — 한국은 서머타임이 없어 연중 고정). 계절 판정은 필요 없다:
#   일일 발행(여름 06:30 수집 → 07:00 공개 · 겨울 07:10 수집 → 07:30 공개, D26) 뒤이고, 사람 push 금지 시간대(06:00~08:00 KST,
#   CLAUDE.md §10)의 끝 경계에서 시작한다(GitHub schedule은 늦게 시작할 수는 있어도 일찍 시작하지 않는다). 그 금지는 사람 push
#   규칙이라 봇 커밋에는 해당하지 않는다(collect.yml '봇 커밋 시각').
#   저장소 변수 COLLECT_ENABLED == 'true'(정기 운영 켜짐 — collect.yml과 같은 스위치)이고 WEEKLY_ENABLED != 'off'일 때만
#   진행한다. WEEKLY_ENABLED는 비었거나 없으면 켬, 'off'면 주간 정기 실행만 끈다(collect.yml COLLECT_FOOTBALL_STAGES와 같은 관례
#   — 코드 수정 없이 끄는 스위치). workflow_dispatch는 두 변수와 무관하게 진행한다.
# - workflow_dispatch: force(같은 주 재실행 가드 무시) · dry(data/에 쓰지 않음 — LLM을 부른 단계가 있으면 비용은 기록) · only(그 단계만 — M4-06) · week(지난
#   ISO 주차 지정, 비우면 지난 주). main이 아닌 ref의 실행은 건너뛴다(data 커밋·Pages 배포는 main 전용).
# - 같은 주 재실행 가드는 data 파일로 판정하므로(weekly-run.ts decideWeeklyGuard) Actions 이력 조회가 필요 없다 — collect.yml과 달리
#   guard job이 없다(main 최신 체크아웃이 앞 실행의 커밋을 본다).
#
# concurrency `collect` — collect.yml과 같은 그룹(같은 data/ 파일 동시 쓰기 방지 — 특히 data/runs.json). 진행 중인 실행은 끊지
# 않는다. 대기는 그룹 전체에서 최신 1건만 남으므로, 월요일 일일 수집이 08:00까지 끝나지 않아 백업 수집이 대기 중일 때 이 실행이 오면
# 대기 중이던 백업 수집은 GitHub가 취소한다(평소 일일 수집은 07:45 전에 끝난다 — 겹치면 수동 dispatch로 다시).
name: Weekly
run-name: "Weekly (${{ github.event_name }}${{ inputs.week && format(', week {0}', inputs.week) || '' }}${{ inputs.force && ', force' || '' }}${{ inputs.dry && ', dry' || '' }}${{ inputs.only && format(', only {0}', inputs.only) || '' }})"

on:
  workflow_dispatch:
    inputs:
      force:
        description: "그 주차 주간 리포트가 이미 있어도 실행 (수동 재실행용)"
        type: boolean
        required: false
        default: false
      dry:
        description: "data/에 쓰지 않고 결과만 출력 (LLM을 부른 단계가 있으면 비용은 기록 — 커밋은 실행 기록뿐)"
        type: boolean
        required: false
        default: false
      week:
        description: "대상 ISO 주차 YYYY-WW (비우면 지난 주 — 실행 시작 KST 날짜가 속한 주의 바로 앞 주). 끝나지 않은 주는 실패"
        type: string
        required: false
        default: ""
      only:
        description: "이 단계만 실행 (비우면 전체 — 예: team-profiles). 그 주차 리포트가 이미 있으면 force도 켤 것 (M4-06)"
        type: string
        required: false
        default: ""
  # 주 경로: cron-job.org 작업(월 08:05 KST, Asia/Seoul) → workflow_dispatch 본문 {"ref":"main"} — collect.yml과 같은 PAT(저장소에 두지
  # 않는다). 2026-11-02 첫 정기 schedule이 10:40 KST까지 시작되지 않아(GitHub cron 지연·누락) 사용자 결정으로 추가. 아래 schedule은
  # 백업 — 같은 주 두 번째 실행은 재실행 가드(주간 리포트 파일 있음)로 건너뛴다.
  schedule:
    - cron: "0 23 * * 0" # 월요일 08:00 KST (백업)

concurrency:
  group: collect
  cancel-in-progress: false

# 기본 권한은 없음 — job마다 필요한 권한만 준다.
permissions: {}

jobs:
  weekly:
    name: 주간 작업 · 검증 · 빌드 · 커밋 (weekly)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (vars.COLLECT_ENABLED == 'true' && vars.WEEKLY_ENABLED != 'off'))
    runs-on: ubuntu-latest
    # job 상한(여유 포함): 가장 긴 주간 작업 40분 + 그 밖의 단계 실측 1~2분 + 실패 실행 기록 보존 3분 + 실패 단계 기록 1분 +
    # 단계 실패 표시 1분 ≈ 47분 < 50분(tests/weekly-workflow.test.ts가 "가장 큰 step 상한 + 실패 경로 단계 상한 + 1분 ≤ job 상한"을
    # 확인한다). 주간 작업 40분 안에 단계 시간 상한 합계(weekly-stages.ts — 지금 36분)가 들어간다. 2026-11-02 사용자 승인 35→40분
    # (팀 프로필 단계 12→18분 — M4-06).
    timeout-minutes: 50
    permissions:
      contents: write # data/·public/ 커밋 push
    # 토큰(github.token)을 env로 받는 단계는 둘뿐이다: data 커밋 · 실패 실행 기록 보존. 토큰은 git 헤더로만 넘기고 git 훅을 끈다.
    # reason·step은 실패 단계 기록(앞 단계 실패) 또는 단계 실패 표시(partial)가 쓴다 — 둘은 함께 돌지 않는다.
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
      publish_date: ${{ steps.weekly.outputs.publish_date }}
      week: ${{ steps.weekly.outputs.week }}
      run_id: ${{ steps.weekly.outputs.run_id }}
      status: ${{ steps.weekly.outputs.status }}
      reason: ${{ steps.stopped.outputs.reason || steps.stages.outputs.reason }}
      step: ${{ steps.stopped.outputs.step || steps.stages.outputs.step }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      LLM_MODE: live
      LLM_MODEL: claude-haiku-5-5
      DAILY_BUDGET_USD: "0.10"
      MONTHLY_BUDGET_USD: "3"
      SITE_URL: https://sguys99.github.io
      BASE_PATH: /euro-digest
      CONTACT_EMAIL: sguys99@gmail.com
    steps:
      # 실행이 concurrency로 기다리는 동안 main이 앞서 갔을 수 있어(월요일 일일 수집의 data 커밋) main 최신을 받는다.
      # 쓰기 토큰을 .git/config에 남기지 않는다(push 단계에서만 헤더로 넘긴다).
      - name: 저장소 체크아웃 (main)
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # 이 실행이 받은 main 커밋 — 기록용(실패 실행 기록 보존은 원장을 덮지 않으므로 비교하지 않는다)
      - name: 기준 커밋 기록
        id: base
        timeout-minutes: 1
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Node.js 설정 (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        id: install
        timeout-minutes: 4
        run: npm ci

      # ① 주간 단계. 비밀값은 이 단계에만 넘긴다(설치·검증·빌드 단계에는 노출하지 않는다). GitHub 토큰은 넘기지 않는다.
      # 입력값(force·dry·week·only)은 셸에 직접 펼치지 않고 env로 넘긴다(스크립트 주입 방지). 값 검증은 weekly 스크립트가 한다.
      - name: 주간 작업 (npm run weekly)
        id: weekly
        timeout-minutes: 40
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FORCE: ${{ inputs.force }}
          DRY: ${{ inputs.dry }}
          WEEK: ${{ inputs.week }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ "$DRY" = "true" ]; then
            args+=(--dry)
          fi
          if [ -n "$WEEK" ]; then
            args+=(--week "$WEEK")
          fi
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          npm run weekly -- "${args[@]}"

      # partial일 때만(주간 작업이 exit 0 + discard 출력). 경로는 코드 상수(weekly-stages.ts writes)지만 경계에서 형식을 다시 본다.
      # 추적 파일은 HEAD로 되돌리고(없던 경로면 무시) 새 파일은 지운다. 토큰을 받지 않는다.
      - name: 실패 단계 산출물 되돌리기
        id: discard
        if: steps.weekly.outputs.discard != ''
        timeout-minutes: 1
        env:
          DISCARD: ${{ steps.weekly.outputs.discard }}
        run: |
          read -r -a paths <<< "$DISCARD"
          for p in "${paths[@]}"; do
            if [[ ! "$p" =~ ^(data|public)/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "$p" == *..* ]] || [ "$p" = "data/runs.json" ]; then
              echo "::error title=되돌릴 경로 형식 오류::weekly 단계 출력 discard에 형식 밖 경로가 있어 커밋을 멈춥니다"
              exit 1
            fi
            git -c core.hooksPath=/dev/null restore --source=HEAD --staged --worktree -- "$p" 2> /dev/null || true
            git -c core.hooksPath=/dev/null clean -fdq -- "$p"
            echo "되돌림: $p"
          done
          echo "::warning title=실패 단계 산출물 되돌림::${DISCARD}"

      # ② 검증 게이트(configs·data 스키마·교차 참조). 실패하면 아래 빌드·커밋으로 가지 않는다 → 사이트 유지 + 실패 이슈.
      - name: 검증 게이트 (npm run validate)
        id: validate
        if: steps.weekly.outputs.skipped != 'true'
        timeout-minutes: 5
        run: npm run validate

      # ③ 앞 — OG 이미지 준비(M5-01, PRD DR-10): 빌드 첫 단계(scripts/build-og.ts)가 입력이 바뀐 OG PNG만 굽는다(주간 작업은 보통 0장 —
      #    팀 표기 · 소속 대회가 바뀌었을 때만). 구울 것이 있을 때만 브라우저 캐시(ci.yml과 같은 키) · Chromium 설치. 구운 PNG는 ④가
      #    public/과 함께 커밋한다(collect.yml과 같은 규칙).
      - name: OG 이미지 확인 (npm run build:og -- --check)
        id: og
        if: steps.weekly.outputs.skipped != 'true'
        timeout-minutes: 2
        run: |
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          npm run build:og -- --check

      - name: Playwright 브라우저 캐시 (OG 이미지)
        if: steps.weekly.outputs.skipped != 'true' && steps.og.outputs.stale != '0'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.og.outputs.playwright }}

      - name: Chromium 설치 (OG 이미지)
        id: chromium
        if: steps.weekly.outputs.skipped != 'true' && steps.og.outputs.stale != '0'
        timeout-minutes: 4
        run: npx playwright install --with-deps chromium

      # ③ 빌드가 깨지는 데이터는 커밋하지 않는다. 배포용 빌드는 deploy.yml이 커밋한 SHA로 다시 한다.
      - name: 정적 빌드 (npm run build)
        id: build
        if: steps.weekly.outputs.skipped != 'true'
        timeout-minutes: 10
        run: npm run build

      # ④ data/·public/ 변경분만 github-actions[bot]으로 커밋 → main 최신으로 rebase → push(collect.yml data 커밋과 같은 규칙 —
      #    rebase 충돌은 재시도하지 않고 되돌린 뒤 실패, 네트워크 오류·push 경합은 3번까지). 메시지의 날짜·주차는 주간 작업 단계 출력.
      - name: data 커밋 · push
        id: commit
        if: steps.weekly.outputs.skipped != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_DATE: ${{ steps.weekly.outputs.publish_date }}
          WEEK: ${{ steps.weekly.outputs.week }}
        run: |
          if [[ ! "$PUBLISH_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [[ ! "$WEEK" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            echo "::error title=단계 출력 없음::주간 작업 단계 출력 publish_date·week가 비었거나 형식이 아닙니다 — 커밋하지 않습니다"
            exit 1
          fi

          # 커밋 대상 경로 중 있는 것만 쓴다(없는 pathspec은 git add가 거부한다).
          paths=()
          for dir in data public; do
            if [ -e "$dir" ]; then
              paths+=("$dir")
            fi
          done

          changes=""
          if [ "${#paths[@]}" -gt 0 ]; then
            changes="$(git status --porcelain --untracked-files=all -- "${paths[@]}")"
          fi

          # 산출물 경로 밖의 변경은 커밋하지 않는다. 파이프라인이 엉뚱한 곳에 쓰고 있다는 신호라 경고로 남긴다.
          outside="$(git status --porcelain --untracked-files=all -- . ':(exclude)data' ':(exclude)public')"
          if [ -n "$outside" ]; then
            echo "::warning title=산출물 경로 밖 변경::data/·public/ 밖의 변경은 커밋하지 않습니다 (로그 참고)"
            echo "$outside"
          fi

          if [ -z "$changes" ]; then
            echo "data/·public/ 변경 없음 — 커밋·배포를 건너뜁니다."
            {
              echo "committed=false"
              echo "sha="
            } >> "$GITHUB_OUTPUT"
            {
              echo "## data 커밋"
              echo ""
              echo "변경 없음 — 커밋·배포를 건너뛰었습니다."
            } >> "$GITHUB_STEP_SUMMARY" || echo "::warning title=요약 쓰기 실패::data 커밋 요약을 Step Summary에 쓰지 못했습니다"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "${paths[@]}"
          # 이 단계의 git은 훅을 돌리지 않는다 — 앞 단계 코드가 .git/hooks를 심었어도 토큰을 보지 못하게
          git_nohooks=(-c core.hooksPath=/dev/null)
          message="chore(data): ${PUBLISH_DATE} 주간 발행 (${WEEK})"
          git "${git_nohooks[@]}" commit --quiet -m "$message"

          # 인증은 actions/checkout과 같은 방식(http extraheader)으로 이 단계의 git 명령에만 붙인다(디스크에 남기지 않음).
          basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${basic_auth}"
          git_auth=("${git_nohooks[@]}" -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${basic_auth}")

          for attempt in 1 2 3; do
            if ! git "${git_auth[@]}" pull --rebase --autostash origin main; then
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                conflicts="$(git diff --name-only --diff-filter=U | head -n 20)"
                git "${git_nohooks[@]}" rebase --abort || true
                echo "::error title=rebase 충돌::main의 새 커밋과 data 커밋이 충돌해 push하지 않았습니다 — 커밋·배포 없음. 충돌 파일은 로그 참고"
                echo "충돌 파일:"
                echo "$conflicts"
                exit 1
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error title=pull 실패::3번 시도했지만 main을 받지 못했습니다"
                exit 1
              fi
              sleep $((attempt * 5))
              continue
            fi
            if git "${git_auth[@]}" push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=push 실패::3번 시도했지만 main에 push하지 못했습니다"
              exit 1
            fi
            sleep $((attempt * 5))
          done

          # push 직후 deploy job이 읽는 출력부터 쓴다. 그 뒤 요약 쓰기는 실패해도 경고만 남긴다.
          sha="$(git rev-parse HEAD)"
          {
            echo "committed=true"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## data 커밋"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 커밋 | [\`${sha:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha) |"
            echo "| 메시지 | ${message} |"
            echo "| 변경 | $(git show --shortstat --format= HEAD | sed 's/^ *//') |"
          } >> "$GITHUB_STEP_SUMMARY" || echo "::warning title=요약 쓰기 실패::data 커밋 요약을 Step Summary에 쓰지 못했습니다 — push·배포는 계속합니다"

      # 실패 실행 기록 보존 (D49 — FR-151, CLAUDE.md §1-4): 위 단계 중 하나가 실패해 발행되지 않았고, 주간 작업이 이번 실행 기록을
      # 러너의 runs.json에 남겼을 때만. collect.yml 같은 단계와 같은 절차(scripts/preserve-run.ts save·apply, main 최신 별도 작업 트리,
      # 3번 재시도)에서 원장·이월을 빼고 data/runs.json만 커밋한다. 배포하지 않는다.
      - name: 실패 실행 기록 보존
        id: preserve
        if: failure() && steps.weekly.outputs.run_recorded == 'true'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.weekly.outputs.run_id }}
          PUBLISH_DATE: ${{ steps.weekly.outputs.publish_date }}
          PRESERVE_DIR: ${{ runner.temp }}/preserve
          MAIN_DIR: ${{ runner.temp }}/preserve-main
        run: |
          # 토큰은 이 단계의 git 명령 헤더로만 — 아래 node 프로세스(보관·적용)에는 넘기지 않는다. git 훅은 끈다.
          git_nohooks=(-c core.hooksPath=/dev/null)
          basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${basic_auth}"
          git_auth=("${git_nohooks[@]}" -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${basic_auth}")
          unset GH_TOKEN

          if [[ ! "$RUN_ID" =~ ^weekly-(prod|dev)-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{4}$ ]] || [[ ! "$PUBLISH_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error title=실행 기록 보존 불가::주간 작업 단계 출력 run_id·publish_date가 형식에 맞지 않아 보존할 기록을 정할 수 없습니다"
            exit 1
          fi

          # 커밋 단계가 rebase 도중 멈췄으면 되돌린다(충돌 표시가 남은 runs.json을 보관하지 않게)
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            git "${git_nohooks[@]}" rebase --abort || true
          fi

          rm -rf "$PRESERVE_DIR"
          node --import tsx scripts/preserve-run.ts save --run-id "$RUN_ID" --dir "$PRESERVE_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          message="chore(data): ${PUBLISH_DATE} 주간 실행 기록 (발행 실패)"
          pushed=false
          for attempt in 1 2 3; do
            if ! git "${git_auth[@]}" fetch --quiet origin main; then
              if [ "$attempt" -eq 3 ]; then
                echo "::error title=실행 기록 보존 — fetch 실패::3번 시도했지만 main을 받지 못했습니다"
                exit 1
              fi
              sleep $((attempt * 5))
              continue
            fi
            git "${git_nohooks[@]}" worktree remove --force "$MAIN_DIR" > /dev/null 2>&1 || true
            rm -rf "$MAIN_DIR"
            git "${git_nohooks[@]}" worktree prune
            git "${git_nohooks[@]}" worktree add --quiet --detach "$MAIN_DIR" FETCH_HEAD

            # 실행 기록 1건 더하기(멱등). 주간 작업은 원장·이월을 쓰지 않으므로 원장 플래그 없이 — 원장·이월은 덮지 않는다
            node --import tsx scripts/preserve-run.ts apply --dir "$PRESERVE_DIR" --root "$MAIN_DIR" --result "$PRESERVE_DIR/result.txt"

            if [ ! -e "$MAIN_DIR/data/runs.json" ]; then
              echo "보존할 경로 없음 — 커밋하지 않습니다."
              break
            fi
            changes="$(git -C "$MAIN_DIR" status --porcelain --untracked-files=all -- data/runs.json)"
            if [ -z "$changes" ]; then
              echo "보존할 변경 없음 — 이번 실행 기록이 이미 main에 있거나(커밋 단계가 push함) 보관된 기록이 없습니다."
              break
            fi
            git -C "$MAIN_DIR" add -A -- data/runs.json
            git -C "$MAIN_DIR" "${git_nohooks[@]}" commit --quiet -m "$message"
            if git -C "$MAIN_DIR" "${git_auth[@]}" push --quiet origin HEAD:main; then
              pushed=true
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=실행 기록 보존 — push 실패::3번 시도했지만 main에 push하지 못했습니다"
              exit 1
            fi
            echo "push 실패 — main 최신으로 작업 트리를 다시 만들어 적용합니다(적용은 멱등)."
            sleep $((attempt * 5))
          done

          {
            echo "pushed=${pushed}"
            if [ -s "$PRESERVE_DIR/result.txt" ]; then
              cat "$PRESERVE_DIR/result.txt"
            fi
          } >> "$GITHUB_OUTPUT"
          if [ "$pushed" = "true" ]; then
            sha="$(git -C "$MAIN_DIR" rev-parse HEAD)"
            {
              echo "## 실패 실행 기록 보존"
              echo ""
              echo "| 항목 | 값 |"
              echo "|---|---|"
              echo "| 커밋 | [\`${sha:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha) |"
              echo "| 메시지 | ${message} |"
              echo "| 배포 | 하지 않음 — 사이트는 그대로 |"
            } >> "$GITHUB_STEP_SUMMARY" || echo "::warning title=요약 쓰기 실패::실행 기록 보존 요약을 Step Summary에 쓰지 못했습니다"
          fi
          git "${git_nohooks[@]}" worktree remove --force "$MAIN_DIR" > /dev/null 2>&1 || true

      # 실패 단계 기록 — 위 단계 중 하나가 실패했을 때만. 멈춘 단계를 job output reason(문구)·step(단계 id — 원인 키
      # `weekly:weekly/<step>`)으로 넘긴다. 값은 고정 문구 + 형식을 확인한 주차만(입력값을 옮기지 않는다). 토큰을 받지 않는다.
      - name: 실패 단계 기록
        id: stopped
        if: failure()
        timeout-minutes: 1
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          WEEKLY_OUTCOME: ${{ steps.weekly.outcome }}
          DISCARD_OUTCOME: ${{ steps.discard.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          OG_OUTCOME: ${{ steps.og.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.chromium.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          PRESERVE_OUTCOME: ${{ steps.preserve.outcome }}
          PRESERVE_PUSHED: ${{ steps.preserve.outputs.pushed }}
          PRESERVE_RECORD: ${{ steps.preserve.outputs.record }}
          WEEK: ${{ steps.weekly.outputs.week }}
        run: |
          if [ "$INSTALL_OUTCOME" = "failure" ]; then
            reason="의존성 설치(npm ci) 실패 — 주간 작업 안 함"
            step="install"
          elif [ "$WEEKLY_OUTCOME" = "failure" ]; then
            reason="주간 작업(npm run weekly) 실패 — 성공한 단계 없음 또는 준비·실행 기록 실패, 검증·빌드·커밋·배포 안 함"
            step="weekly"
          elif [ "$DISCARD_OUTCOME" = "failure" ]; then
            reason="실패 단계 산출물 되돌리기 실패 — 커밋·배포 안 함"
            step="discard"
          elif [ "$VALIDATE_OUTCOME" = "failure" ]; then
            reason="검증 게이트(npm run validate) 실패 — 커밋·배포 안 함, 사이트 유지"
            step="validate"
          elif [ "$OG_OUTCOME" = "failure" ] || [ "$CHROMIUM_OUTCOME" = "failure" ]; then
            reason="OG 이미지 준비(확인·Chromium 설치) 실패 — 빌드·커밋·배포 안 함, 사이트 유지"
            step="og"
          elif [ "$BUILD_OUTCOME" = "failure" ]; then
            reason="정적 빌드(npm run build) 실패 — 커밋·배포 안 함, 사이트 유지"
            step="build"
          elif [ "$COMMIT_OUTCOME" = "failure" ]; then
            reason="data 커밋·push 단계 실패 — 배포 안 함(main에 push까지 됐는지는 로그 확인)"
            step="commit"
          else
            reason="준비 단계(체크아웃·Node.js 설정) 실패 — 주간 작업 안 함"
            step="setup"
          fi
          if [[ "$WEEK" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            reason="${reason} (주차 ${WEEK})"
          fi
          if [ "$PRESERVE_OUTCOME" = "failure" ]; then
            reason="${reason} · 실행 기록 보존 실패 — 이 실행의 비용 기록이 커밋되지 않음(로그 확인)"
          elif [ "$PRESERVE_OUTCOME" = "success" ]; then
            if [ "$PRESERVE_PUSHED" = "true" ]; then
              reason="${reason} · 실행 기록(상태 failed) 커밋함"
            elif [ "$PRESERVE_RECORD" = "already" ]; then
              reason="${reason} · 실행 기록은 이미 main에 있음"
            else
              reason="${reason} · 보존할 실행 기록 없음"
            fi
          fi
          {
            echo "reason=${reason}"
            echo "step=${step}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## 실패 단계"
            echo ""
            echo "${reason}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 단계 실패 표시 — partial(일부 단계 실패, 주간 작업 exit 0)이면 마지막에 job을 실패로 바꾼다. 앞 단계가 모두 성공했을 때만
      # 돈다(앞 단계 실패는 실패 단계 기록이 맡는다). 성공한 단계의 산출물은 위에서 이미 커밋됐고, deploy job은 job 결과가 아니라
      # committed 출력으로 진행한다. 실패 단계 id는 형식을 확인한 값만 메모로 옮긴다.
      - name: 단계 실패 표시
        id: stages
        if: steps.weekly.outputs.status == 'partial'
        timeout-minutes: 1
        env:
          FAILED_STAGES: ${{ steps.weekly.outputs.failed_stages }}
          WEEK: ${{ steps.weekly.outputs.week }}
        run: |
          if [[ ! "$FAILED_STAGES" =~ ^[a-z][a-z0-9-]*(,[a-z][a-z0-9-]*)*$ ]]; then
            FAILED_STAGES="(형식 밖 값 — 로그 확인)"
          fi
          reason="일부 단계 실패: ${FAILED_STAGES} — 성공한 단계 산출물만 커밋·배포"
          if [[ "$WEEK" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            reason="${reason} (주차 ${WEEK})"
          fi
          {
            echo "reason=${reason}"
            echo "step=stages"
          } >> "$GITHUB_OUTPUT"
          echo "::error title=주간 작업 일부 단계 실패::${reason}"
          exit 1

  # ⑤ 배포. GITHUB_TOKEN으로 push한 커밋은 ci.yml을 다시 트리거하지 않으므로 여기서 직접 배포한다.
  # 조건은 job 결과가 아니라 커밋 출력이다 — partial(단계 실패 표시로 job 실패)이어도 커밋한 성공 단계 산출물은 배포한다.
  # 커밋 단계는 검증·빌드가 통과했을 때만 돌므로 committed == 'true'면 검증·빌드를 통과한 커밋이다. 수동 취소면 배포하지 않는다.
  deploy:
    name: 배포 (GitHub Pages)
    needs: weekly
    if: ${{ !cancelled() && needs.weekly.outputs.committed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.weekly.outputs.sha }}

  # FR-152 실행 실패 자동 이슈 — collect.yml report-failure와 같은 구조(원인 키 `weekly:<실패 job>[/<멈춘 단계>]`, 같은 원인은 댓글).
  report-failure:
    name: 실패 이슈 보고
    needs: [weekly, deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read # checkout
      issues: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js 설정 (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        timeout-minutes: 4
        run: npm ci

      - name: 이슈 생성 또는 댓글 (이슈 헬퍼)
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node --import tsx scripts/report-issue.ts --kind pipeline-failure --workflow weekly

      # 위 단계 중 하나라도 실패했을 때만(헬퍼가 이미 보고했으면 건너뜀). 마커 없이 예전 규칙으로 보고한다.
      - name: 셸 폴백 — 이슈 헬퍼를 쓸 수 없을 때
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          WEEKLY_RESULT: ${{ needs.weekly.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          now_kst="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          date_kst="$(TZ=Asia/Seoul date +%F)"
          body_file="$RUNNER_TEMP/pipeline-failure.md"
          {
            echo "weekly.yml 주간 작업 실행이 실패했습니다. (이슈 헬퍼를 쓸 수 없어 셸 폴백으로 보고 — 보고 job 로그 확인)"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 실행 | ${RUN_URL} (시도 ${RUN_ATTEMPT}) |"
            echo "| 트리거 | ${EVENT_NAME} |"
            echo "| 시각 (KST) | ${now_kst} |"
            echo "| job 결과 | weekly ${WEEKLY_RESULT:-?} · deploy ${DEPLOY_RESULT:-?} |"
          } > "$body_file"

          existing="$(gh issue list --state open --label pipeline-failure --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("[weekly]"))] | sort_by(.number) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body_file"
            echo "열린 이슈 #${existing}에 댓글을 남겼습니다 (셸 폴백)."
          else
            gh issue create \
              --title "[weekly] 주간 작업 실패 — ${date_kst}" \
              --label pipeline-failure \
              --body-file "$body_file"
          fi
