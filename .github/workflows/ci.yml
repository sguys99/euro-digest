# 검사 워크플로 (M0-12, NFR-12) — push·PR마다 정적 export 사이트 전체를 검사한다.
# check(typecheck·lint·단위 테스트) → 서식 → 설정 검증 → Chromium 설치(OG 이미지 · e2e) → 빌드 → 번들 예산·비밀값 → e2e(스모크·링크·접근성)
# main push에서 통과하면 재사용 워크플로 deploy.yml로 배포한다(M0-13, PRD §15 D20 — 파일 끝 deploy job).
# Lighthouse 모바일(M5-08 — lighthouse job)은 main push · PR · 수동 실행에서 따로 돌고 배포를 기다리게 하지 않는다.
#
# 참고
# - 봇의 data 커밋은 GITHUB_TOKEN으로 push되므로 이 워크플로를 다시 트리거하지 않는다(GitHub 규칙).
#   collect.yml·weekly.yml은 스스로 빌드·검증 후 deploy.yml을 호출한다(CLAUDE.md §6.1).
# - 06:00~08:00 KST push 금지(계절 무관 — 여름 06:30 수집 → 07:00 공개, 겨울 07:10 수집 → 07:30 공개와 공개 허용 범위
#   '목표 시각까지, 늦어도 +15분'(NFR-05, PRD §15 D48)을 한 구간으로 덮는다. 계절은 src/lib/time.ts publishSlot이 판정)는
#   **사람 push** 운영 규칙이라 여기서 강제하지 않는다
#   (CLAUDE.md §10, PRD §15 D26). 그 시간에 사람이 push하면 collect 실행의 data 커밋 rebase·배포(concurrency: pages)와 겹친다.
#   봇(collect.yml)의 data 커밋은 바로 이 시간대에 하는 것이 정상이다 — 이 워크플로를 트리거하지도 않는다(위 항목).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      lighthouse_method:
        description: Lighthouse 스로틀링 방식 — devtools(기본 · 단언 기준) / simulate(PageSpeed Insights 방식 — 비교 기록용)
        type: choice
        options: [devtools, simulate]
        default: devtools

# 같은 브랜치의 새 push가 오면 이전 실행을 취소한다. 단 main은 취소하지 않고 순서대로 처리한다:
# 배포 job(deploy-pages)이 도중에 끊기지 않게 하고, 검사를 통과한 커밋이 뒤 커밋의 실패로 배포 없이
# 사라지지 않게 하기 위해서다. 대기는 최신 1건만 남으므로(중간 대기분은 GitHub가 취소) 밀려 쌓이지 않는다.
# 그룹 이름은 deploy.yml의 `pages`와 겹치지 않아야 한다(같으면 호출 측과 서로 기다린다).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  LLM_MODE: mock
  CI: true

jobs:
  check:
    name: 검사 (check · build · 번들 예산 · e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js 설정 (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: typecheck · lint · 단위 테스트
        run: npm run check

      - name: 서식 검사 (Prettier)
        run: npm run format:check

      # configs/* zod 스키마·교차 참조 + data/* 스키마(M0-17) + 발행 검증 게이트(M1-25 — 카드 ai·요약 줄·링크 형식, 미래 날짜
      # 파일, 남은 삭제 요청 카드·보존 기간 만료 출처). 잘못된 설정·데이터면 여기서 실패한다.
      # --publish-date 없이 돌리므로 카드 수 하한은 검사 시각의 KST 오늘 파일이 있을 때만 본다(없으면 건너뜀 — 그날 발행 전 push가
      # 막히지 않게). 발행 실행의 엄격 검사(그 발행일 파일이 없으면 실패)는 collect.yml이 수집 단계의 발행일로 한다(M1-26).
      - name: 설정·데이터 검증 (configs·data 스키마)
        run: npm run validate

      # 빌드 첫 단계(scripts/build-og.ts — M5-01)가 입력이 바뀐 OG 이미지를 Chromium으로 굽고, e2e도 Chromium을 쓴다 — 빌드 앞에 설치한다.
      - name: Playwright 버전 확인
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright 브라우저 캐시
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # 캐시가 맞으면 브라우저 다운로드는 건너뛰고 OS 의존성만 설치한다.
      - name: Playwright 브라우저 설치 (chromium + OS 의존성)
        run: npx playwright install --with-deps chromium

      - name: 정적 빌드 (next build → out/)
        run: npm run build

      - name: 번들 예산 · 비밀값 검사 (DR-11, NFR-07)
        run: npm run check:bundle

      - name: e2e — 스모크 · 링크 · 접근성 (NFR-12)
        id: e2e
        run: npm run test:e2e

      - name: Playwright 리포트 업로드 (e2e 실패 시)
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # 기초 컴포넌트 견본 검사(D0-12) — SPECIMEN=1 빌드(out-specimen/)를 따로 만들어 실제 브라우저에서
  # axe·44px·포커스 링 대비·reduced-motion·탭 키보드·토스트·테마 토글·theme-color를 검사한다.
  # M1-30부터 공개 페이지(앱 셸)가 테마 토글·토스트·하단 탭·상단 내비를 쓰므로 배포 조건(deploy needs)에 넣었다 —
  # 견본 검사가 실패하면 배포하지 않는다. 공개 페이지 자체의 셸 검사는 check job의 e2e(tests/e2e/shell.spec.ts).
  # .next/를 일반 빌드와 같이 쓰므로 check job과 다른 러너(별도 job)에서 돌린다.
  specimen:
    name: 견본 검사 (기초 컴포넌트 · SPECIMEN 빌드)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js 설정 (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 버전 확인
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright 브라우저 캐시
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Playwright 브라우저 설치 (chromium + OS 의존성)
        run: npx playwright install --with-deps chromium

      - name: 견본 빌드 + e2e (npm run test:specimen)
        id: specimen
        run: npm run test:specimen

      - name: 견본 리포트·스크린샷 업로드 (실패 시)
        if: failure() && steps.specimen.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: specimen-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Lighthouse 모바일(M5-08 — NFR-01 · DR-11 · NFR-02) — `npm run lighthouse -- --assert`(scripts/lighthouse.ts + lighthouserc.json,
  # M5-07 도구 그대로). 단언: error LCP ≤ 2000ms · CLS ≤ 0.05 · 접근성 ≥ 0.9 · SEO ≥ 0.9(/status/·/search/ noindex 제외) /
  # warn 성능 ≥ 0.95(NFR-01 판정 방식 사용자 결정 전 — 기록만). 결과는 Step Summary 표 + artifact(lhr JSON·HTML). 외부 업로드 없음.
  # - 조건: main push · PR · 수동 실행(다른 브랜치 push는 건너뜀). 수동 실행은 lighthouse_method 입력으로 simulate도 잰다.
  # - 배포(deploy job)는 이 job을 기다리지 않는다(needs에 없음) — 측정 시간(docs/research/m5-performance.md §11)이 배포를 늦추지 않게. error 단언이 실패하면 CI 실행만 빨갛게
  #   표시된다(배포는 check·specimen 기준으로 이미 진행). 아침 봇 발행(collect.yml·weekly.yml → deploy.yml)은 이 워크플로를 거치지 않는다.
  # - out/은 check job에서 artifact로 넘겨 받지 않고 여기서 다시 빌드한다: needs: check면 e2e(약 16분)가 끝나야 시작되고, out/은
  #   216MB · 3,679파일이라 올리고 받는 시간이 빌드(약 40초)보다 길다. 배포도 deploy.yml이 커밋을 다시 빌드한다(같은 원칙).
  # - 한글 글꼴 fonts-noto-cjk를 이 job에만 설치한다(2026-11-04 사용자 결정 A — PRD §15 D78). 러너 기본 한글 글꼴(WenQuanYi)은
  #   메트릭 폴백(src/lib/fonts.ts — 맑은 고딕 · Noto Sans CJK KR)에 없어 웹폰트 swap 때 줄이 바뀌고 CLS 0.12~0.16이 나왔다(측정 환경 문제 —
  #   Noto CJK KR이 있으면 0.000x, docs/research/m5-performance.md §11.3). 빌드 뒤에 설치해 OG 이미지 굽기와 check job의 e2e(fonts.spec
  #   CI skip · 스크린샷)는 그대로 둔다. .deb는 actions/cache로 재사용한다.
  lighthouse:
    name: Lighthouse 모바일 (LCP·CLS·접근성·SEO 단언 · 성능 기록)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js 설정 (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # check job과 같은 캐시 키 — Lighthouse도 Playwright Chromium(chromium.executablePath())으로 잰다. 빌드 첫 단계(OG 이미지)도 쓴다.
      - name: Playwright 버전 확인
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright 브라우저 캐시
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Playwright 브라우저 설치 (chromium + OS 의존성)
        run: npx playwright install --with-deps chromium

      - name: 정적 빌드 (next build → out/)
        run: npm run build

      # 패키지 후보 버전을 캐시 키에 넣는다(우분투 이미지 · 패키지가 바뀌면 새로 받는다). apt 목록은 위 Playwright 의존성 설치가 갱신했다.
      - name: 한글 글꼴 버전 확인 (fonts-noto-cjk)
        id: cjk
        run: |
          version="$(apt-cache policy fonts-noto-cjk | awk '/Candidate:/ {print $2}' | tr -c 'A-Za-z0-9.\n' '_')"
          echo "key=fonts-noto-cjk-$(lsb_release -rs)-${version}" >> "$GITHUB_OUTPUT"

      - name: 한글 글꼴 캐시 (.deb)
        uses: actions/cache@v6
        with:
          path: ~/.cache/fonts-noto-cjk-deb
          key: ${{ steps.cjk.outputs.key }}

      - name: 한글 글꼴 설치 (fonts-noto-cjk — Lighthouse CLS 측정 조건, 이 job에만)
        timeout-minutes: 5
        run: |
          dir="$HOME/.cache/fonts-noto-cjk-deb"
          mkdir -p "$dir"
          if ! ls "$dir"/fonts-noto-cjk_*.deb >/dev/null 2>&1; then
            (cd "$dir" && apt-get download fonts-noto-cjk)
          fi
          sudo dpkg -i "$dir"/fonts-noto-cjk_*.deb
          fc-cache -f
          fc-list :lang=ko family | grep -q "Noto Sans CJK KR"

      # 측정 잡음 해석용(benchmarkIndex와 함께) — CPU 수 · 부하 · 한글을 그릴 수 있는 시스템 글꼴(폴백 탐색 영향 관찰, M5-08 과제 4)
      - name: 측정 환경 기록 (CPU · 부하 · 한글 글꼴)
        run: |
          ko_fonts="$(fc-list :lang=ko family | sort -u | paste -sd ',' - || true)"
          {
            echo "## 측정 환경"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| CPU | $(nproc)코어 · $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs) |"
            echo "| load average | $(cut -d' ' -f1-3 /proc/loadavg) |"
            echo "| 한글 시스템 글꼴 (fc-list :lang=ko) | ${ko_fonts:-없음} |"
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lighthouse 측정 + 단언 (npm run lighthouse -- --assert)
        id: lighthouse
        env:
          LIGHTHOUSE_METHOD: ${{ inputs.lighthouse_method || 'devtools' }}
        run: npm run lighthouse -- --assert --method "$LIGHTHOUSE_METHOD"

      # 성공 · 실패 모두 남긴다(측정이 돌았으면). .lighthouseci/는 점(.) 폴더라 include-hidden-files가 필요하다. site/(out/ 심볼릭 링크)는 뺀다.
      - name: Lighthouse 결과 업로드 (lhr JSON·HTML · 단언 결과 · 요약)
        if: always() && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lighthouseci/.lighthouseci/
            .lighthouseci/summary.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  # main push에서 검사(check·견본 specimen — M1-30부터)를 통과하면 재사용 워크플로로 배포한다(M0-13, PRD §15 D20).
  # - workflow_dispatch(수동 검사)는 배포하지 않는다: 수동 배포·롤백은 deploy.yml 수동 실행 한 경로로 모은다(FR-154).
  # - PR·다른 브랜치 push는 검사만 한다.
  # - Lighthouse(lighthouse job)는 needs에 넣지 않는다 — 측정이 배포를 늦추지 않게(M5-08). 그 job의 error 단언은 CI 표시만 빨갛게 한다.
  # - 배포에 필요한 Pages 권한은 이 job에만 준다(워크플로 기본 권한은 contents: read 유지).
  #   호출된 워크플로는 여기서 준 권한 이하로만 쓸 수 있다: build job contents·pages read, deploy job pages write·id-token write.
  deploy:
    name: 배포 (GitHub Pages)
    needs: [check, specimen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: read # deploy.yml build job — /status 배포 완료 시각(M5-15, 읽기만)
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
