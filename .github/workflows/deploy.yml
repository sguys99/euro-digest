# 재사용 배포 워크플로 (M0-13, PRD §15 D20 · FR-154) — 지정한 커밋을 빌드해 GitHub Pages에 배포한다.
#
# 호출 경로
# - ci.yml: main push에서 검사 통과 후 호출(ref = 검사한 커밋 github.sha)
# - collect.yml·weekly.yml(M0-14~): 검증 → data 커밋 직후 새 커밋 SHA를 ref로 넘겨 호출(CLAUDE.md §6.1)
# - 수동 실행(workflow_dispatch) = 롤백·재배포(FR-154, CLAUDE.md §12):
#     Actions → Deploy → Run workflow → "Use workflow from"은 main 그대로, ref에 되돌릴 커밋 SHA 또는 태그.
#     실행 요약(Summary)에 배포한 ref·SHA·URL이 남는다. 이전 배포 SHA는 지난 실행 요약에서 찾는다.
#
# 주의
# - github-pages environment에 "main 브랜치만 배포" 규칙이 있다. 이 규칙은 체크아웃한 ref가 아니라 워크플로
#   실행의 GITHUB_REF로 판정하므로, "Use workflow from"을 태그·다른 브랜치로 바꾸면 deploy job이 거부된다.
#   과거 커밋·태그는 ref 입력으로만 넘긴다.
# - 그래서 environment 규칙이 체크아웃 대상을 막아 주지 못한다. 대신 build job이 배포 대상 커밋이 main 이력에
#   있는지 확인한다(다른 브랜치 커밋이 운영에 나가지 않게).
# - 호출하는 워크플로는 concurrency 그룹 이름에 `pages`를 쓰지 않는다(같은 그룹이면 호출 측과 서로 기다린다).
# - .nojekyll은 넣지 않는다: 이 방식은 Jekyll을 거치지 않고 아티팩트를 그대로 올리며(_next/ 그대로 서빙),
#   upload-pages-artifact v4+는 점(.) 파일을 기본으로 빼므로 만들어도 올라가지 않는다.
name: Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: 배포할 커밋 SHA·태그·브랜치. 비우면 호출한 워크플로의 커밋(github.sha)
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: 배포할 커밋 SHA 또는 태그 (롤백 시 과거 커밋). main 이력에 있는 커밋만 허용
        type: string
        required: true
        default: main

# 진행 중인 배포는 끊지 않고 순서대로. 대기는 최신 1건만 남는다(그 사이 대기분은 GitHub가 취소).
# 그룹은 저장소 단위라 ci·collect·weekly·수동 실행이 모두 같은 줄에 선다.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 빌드 (next build → out/)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages가 Pages 사이트 정보(GET /repos/{repo}/pages)를 읽는다
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      BASE_PATH: /euro-digest
      SITE_URL: https://sguys99.github.io
    steps:
      - name: 배포 대상 체크아웃
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: 배포 대상 커밋 확인 (main 이력)
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # compare/<sha>...main: main이 sha를 포함하면 ahead(main이 앞섬) 또는 identical
          status="$(gh api "repos/$REPO/compare/$sha...main" --jq .status)"
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "::error title=배포 거부::$REQUESTED_REF ($sha)는 main 이력에 없는 커밋입니다 (compare: $status). main에 있는 커밋·태그만 배포합니다."
            exit 1
          fi
          subject="$(git log -1 --format=%s | sed 's/|/\\|/g')"
          {
            echo "## 배포 대상"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 요청 ref | \`$REQUESTED_REF\` |"
            echo "| 커밋 | [\`${sha:0:7}\`]($GITHUB_SERVER_URL/$REPO/commit/$sha) \`$sha\` |"
            echo "| 커밋 메시지 | $subject |"
            echo "| 트리거 | $GITHUB_EVENT_NAME · $GITHUB_WORKFLOW · @$GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pages 설정 확인
        id: pages
        uses: actions/configure-pages@v6

      # 저장소 이름 변경(plan §14 B6)·커스텀 도메인 설정 시 basePath가 어긋난 채 배포되지 않게 먼저 멈춘다.
      - name: basePath 일치 확인
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          expected="$SITE_URL$BASE_PATH"
          if [ "${PAGES_BASE_URL%/}" != "$expected" ]; then
            echo "::error title=basePath 불일치::Pages 주소 $PAGES_BASE_URL ≠ 빌드 설정 $expected — deploy.yml의 SITE_URL·BASE_PATH를 고칠 것"
            exit 1
          fi

      - name: Node.js 설정 (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 정적 빌드 (next build → out/)
        run: npm run build

      # ci.yml 검사를 거치지 않는 경로(collect·weekly·수동 롤백)도 공개 전에 비밀값·번들 예산을 한 번 더 본다(NFR-07, DR-11).
      - name: 번들 예산 · 비밀값 검사
        run: npm run check:bundle --if-present

      - name: 산출물 확인 (index.html · 404.html · _next/)
        run: |
          for path in out/index.html out/404.html out/_next/static; do
            if [ ! -e "$path" ]; then
              echo "::error title=산출물 누락::$path 가 없습니다"
              exit 1
            fi
          done

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: 배포 (GitHub Pages)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 배포 요약 (롤백 추적용)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REQUESTED_REF: ${{ inputs.ref || github.sha }}
          DEPLOYED_SHA: ${{ needs.build.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## 배포 완료"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| URL | $PAGE_URL |"
            echo "| 요청 ref | \`$REQUESTED_REF\` |"
            echo "| 배포 SHA | [\`${DEPLOYED_SHA:0:7}\`]($GITHUB_SERVER_URL/$REPO/commit/$DEPLOYED_SHA) \`$DEPLOYED_SHA\` |"
            echo "| 완료 시각 (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo ""
            echo "이 버전으로 되돌리기: Actions → Deploy → Run workflow (Use workflow from: main) → ref = \`$DEPLOYED_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "배포 완료: $PAGE_URL ← $REQUESTED_REF ($DEPLOYED_SHA)"
